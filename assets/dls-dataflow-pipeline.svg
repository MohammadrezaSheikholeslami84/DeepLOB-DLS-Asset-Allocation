<svg xmlns="http://www.w3.org/2000/svg" width="920" height="760" viewBox="0 0 920 760"><rect width="920" height="760" fill="white"/><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#64748b"/></marker></defs><style>.b{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:14}.h{font:700 19px Arial;fill:#0f172a;text-anchor:middle}.t{font:15px Arial;fill:#334155;text-anchor:middle}.l{stroke:#64748b;stroke-width:2;marker-end:url(#m)}</style><text class="h" x="460" y="40" style="font-size:27px">DLS Architecture and Data Flow</text><g><rect class="b" x="125" y="75" width="670" height="78"/><text class="h" x="460" y="105">Step 1: DeepLOB outputs</text><text class="t" x="460" y="132">For each asset/day: pdown, pflat, pup</text><line class="l" x1="460" y1="153" x2="460" y2="185"/><rect class="b" x="125" y="186" width="670" height="84"/><text class="h" x="460" y="218">Step 2: Build the five-feature probability panel</text><text class="t" x="460" y="246">[pdown, pflat, pup, signal_score, confidence]</text><line class="l" x1="460" y1="270" x2="460" y2="302"/><rect class="b" x="125" y="303" width="670" height="84"/><text class="h" x="460" y="335">Step 3: Stack the 50-day history</text><text class="t" x="460" y="363">X_DLS(t) ∈ R^(50 × N × 5)</text><line class="l" x1="460" y1="387" x2="460" y2="419"/><rect class="b" x="125" y="420" width="670" height="84"/><text class="h" x="460" y="452">Step 4: Flatten each day and feed sequence to LSTM</text><text class="t" x="460" y="480">N × 5 → 5N; hidden size = 64</text><line class="l" x1="460" y1="504" x2="460" y2="536"/><rect class="b" x="125" y="537" width="670" height="84"/><text class="h" x="460" y="569">Step 5: Linear projection to asset logits</text><text class="t" x="460" y="597">final hidden state: 64 → N</text><line class="l" x1="460" y1="621" x2="460" y2="653"/><rect class="b" x="125" y="654" width="670" height="84"/><text class="h" x="460" y="686">Step 6: Tradability mask + masked softmax</text><text class="t" x="460" y="714">long-only weights: wᵢ ≥ 0 and Σwᵢ = 1</text></g></svg>
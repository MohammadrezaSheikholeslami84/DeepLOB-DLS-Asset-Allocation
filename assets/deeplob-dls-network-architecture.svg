<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="white"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#64748b"/></marker></defs><style>.b{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:12}.h{font:700 23px Arial;fill:#0f172a}.t{font:15px Arial;fill:#334155;text-anchor:middle}.bh{font:700 17px Arial;fill:#0f172a;text-anchor:middle}.l{stroke:#64748b;stroke-width:2;marker-end:url(#a)}</style><text x="40" y="45" class="h">DeepLOB signal network</text><g><rect class="b" x="45" y="90" width="170" height="95"/><text class="bh" x="130" y="118">Input tensor</text><text class="t" x="130" y="143">B × 1 × 50 × 259</text><text class="t" x="130" y="165">50-day feature window</text><line class="l" x1="215" y1="138" x2="260" y2="138"/><rect class="b" x="265" y="90" width="175" height="95"/><text class="bh" x="352" y="118">Conv blocks</text><text class="t" x="352" y="143">feature extraction</text><text class="t" x="352" y="165">32 channels</text><line class="l" x1="440" y1="138" x2="485" y2="138"/><rect class="b" x="490" y="90" width="175" height="95"/><text class="bh" x="578" y="118">Inception</text><text class="t" x="578" y="143">3 branches</text><text class="t" x="578" y="165">192 channels</text><line class="l" x1="665" y1="138" x2="710" y2="138"/><rect class="b" x="715" y="90" width="165" height="95"/><text class="bh" x="798" y="118">Temporal LSTM</text><text class="t" x="798" y="143">192 → 64</text><text class="t" x="798" y="165">last hidden state</text><line class="l" x1="880" y1="138" x2="925" y2="138"/><rect class="b" x="930" y="90" width="165" height="95"/><text class="bh" x="1013" y="118">FC + Softmax</text><text class="t" x="1013" y="143">3 logits</text><text class="t" x="1013" y="165">→ probabilities</text></g><text x="40" y="300" class="h">DLS portfolio network</text><g><rect class="b" x="45" y="345" width="175" height="110"/><text class="bh" x="132" y="374">Probability panel</text><text class="t" x="132" y="401">B × 50 × N × 5</text><text class="t" x="132" y="425">DeepLOB-derived</text><line class="l" x1="220" y1="400" x2="265" y2="400"/><rect class="b" x="270" y="345" width="175" height="110"/><text class="bh" x="357" y="374">Flatten per day</text><text class="t" x="357" y="401">N × 5 → 5N</text><text class="t" x="357" y="425">5N = 11,530</text><line class="l" x1="445" y1="400" x2="490" y2="400"/><rect class="b" x="495" y="345" width="175" height="110"/><text class="bh" x="582" y="374">LSTM encoder</text><text class="t" x="582" y="401">5N → 64</text><text class="t" x="582" y="425">50-day sequence</text><line class="l" x1="670" y1="400" x2="715" y2="400"/><rect class="b" x="720" y="345" width="155" height="110"/><text class="bh" x="798" y="374">Linear head</text><text class="t" x="798" y="401">64 → N</text><text class="t" x="798" y="425">asset logits</text><line class="l" x1="875" y1="400" x2="915" y2="400"/><rect class="b" x="920" y="345" width="125" height="110"/><text class="bh" x="982" y="374">Entry mask</text><text class="t" x="982" y="401">non-tradable</text><text class="t" x="982" y="425">→ -1e9</text><line class="l" x1="1045" y1="400" x2="1080" y2="400"/><rect class="b" x="1085" y="345" width="95" height="110"/><text class="bh" x="1132" y="374">Masked</text><text class="bh" x="1132" y="395">softmax</text><text class="t" x="1132" y="426">wᵢ ≥ 0</text></g><text x="600" y="565" class="t" style="font-size:17px">DeepLOB predicts direction; DLS converts the probability history into portfolio weights.</text></svg>
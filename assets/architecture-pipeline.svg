<svg xmlns="http://www.w3.org/2000/svg" width="980" height="920" viewBox="0 0 980 920">
<rect width="980" height="920" fill="#ffffff"/>
<style>.box{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:14}.t{font-family:Arial,sans-serif;fill:#0f172a;text-anchor:middle}.h{font-size:21px;font-weight:700}.s{font-size:15px}.a{stroke:#64748b;stroke-width:2.4;marker-end:url(#m)}</style>
<defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
<text x="490" y="42" class="t h" font-size="28">End-to-End DeepLOB + DLS Portfolio Pipeline</text>
<g>
<rect class="box" x="170" y="75" width="640" height="76"/><text class="t h" x="490" y="105">Input Data</text><text class="t s" x="490" y="132">LOB snapshots + daily OHLCV market data</text>
<line class="a" x1="490" y1="151" x2="490" y2="184"/>
<rect class="box" x="170" y="185" width="640" height="92"/><text class="t h" x="490" y="217">Feature Engineering</text><text class="t s" x="490" y="243">10-level OFI grid, daily factors, rolling features</text><text class="t s" x="490" y="264">normalized feature tensor 50 × 259</text>
<line class="a" x1="490" y1="277" x2="490" y2="310"/>
<rect class="box" x="170" y="311" width="640" height="82"/><text class="t h" x="490" y="343">DeepLOB Signal Model</text><text class="t s" x="490" y="371">CNN + Inception + LSTM → p(down), p(flat), p(up)</text>
<line class="a" x1="490" y1="393" x2="490" y2="426"/>
<rect class="box" x="170" y="427" width="640" height="88"/><text class="t h" x="490" y="459">DLS Feature Panel</text><text class="t s" x="490" y="485">[pdown, pflat, pup, signal_score, confidence]</text><text class="t s" x="490" y="505">for each asset and day</text>
<line class="a" x1="490" y1="515" x2="490" y2="548"/>
<rect class="box" x="170" y="549" width="640" height="92"/><text class="t h" x="490" y="581">ShifuDLSNet Portfolio Allocator</text><text class="t s" x="490" y="607">LSTM + masked softmax converts probability history</text><text class="t s" x="490" y="627">into long-only target weights</text>
<line class="a" x1="490" y1="641" x2="490" y2="674"/>
<rect class="box" x="170" y="675" width="640" height="92"/><text class="t h" x="490" y="707">Execution / Backtest Engine</text><text class="t s" x="490" y="733">tradability masks, rebalance band, lot size, cash buffer,</text><text class="t s" x="490" y="753">T+1 rules and transaction costs</text>
<line class="a" x1="490" y1="767" x2="490" y2="800"/>
<rect class="box" x="170" y="801" width="640" height="88"/><text class="t h" x="490" y="833">Outputs + Dashboard Replay</text><text class="t s" x="490" y="859">trade logs, audits, holdings, portfolio value, turnover,</text><text class="t s" x="490" y="879">drawdown, Sharpe, CAGR and dashboard CSVs</text>
</g></svg>
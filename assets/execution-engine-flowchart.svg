<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="920" viewBox="0 0 1000 920"><rect width="1000" height="920" fill="white"/><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#64748b"/></marker></defs><style>.b{fill:#fff7ed;stroke:#ea580c;stroke-width:2;rx:14}.h{font:700 19px Arial;fill:#0f172a;text-anchor:middle}.t{font:15px Arial;fill:#334155;text-anchor:middle}.l{stroke:#64748b;stroke-width:2;marker-end:url(#m)}</style><text class="h" x="500" y="42" style="font-size:28px">Execution Engine Flow</text><g><rect class="b" x="185" y="70" width="630" height="70"/><text class="h" x="500" y="111">Input: DLS target weights W_target(t)</text><line class="l" x1="500" y1="140" x2="500" y2="172"/><rect class="b" x="120" y="173" width="760" height="76"/><text class="h" x="500" y="204">Compute portfolio value, cash, holdings</text><text class="t" x="500" y="229">and current portfolio weights W_current(t)</text><line class="l" x1="500" y1="249" x2="500" y2="281"/><rect class="b" x="160" y="282" width="680" height="78"/><text class="h" x="500" y="313">Compute weight gap for each asset</text><text class="t" x="500" y="338">ΔW(t,i) = W_target(t,i) - W_current(t,i)</text><line class="l" x1="500" y1="360" x2="500" y2="392"/><rect class="b" x="180" y="393" width="640" height="70"/><text class="h" x="500" y="435">Ignore small gaps when |ΔW| &lt; rebalance band</text><line class="l" x1="500" y1="463" x2="500" y2="495"/><rect class="b" x="90" y="496" width="820" height="78"/><text class="h" x="500" y="527">Process sells first</text><text class="t" x="500" y="552">free cash · respect min holdings · commission + stamp duty</text><line class="l" x1="500" y1="574" x2="500" y2="606"/><rect class="b" x="100" y="607" width="800" height="78"/><text class="h" x="500" y="638">Process buys next</text><text class="t" x="500" y="663">tradability · cash buffer · lot size · buy commission</text><line class="l" x1="500" y1="685" x2="500" y2="717"/><rect class="b" x="130" y="718" width="740" height="70"/><text class="h" x="500" y="760">Partial-fill search until trade becomes feasible</text><line class="l" x1="500" y1="788" x2="500" y2="820"/><rect class="b" x="90" y="821" width="820" height="78"/><text class="h" x="500" y="852">Update portfolio state + record audit outputs</text><text class="t" x="500" y="877">cash, shares, costs, holdings, realized weights, metrics</text></g></svg>
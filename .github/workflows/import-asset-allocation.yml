name: Import Asset Allocation Contributions

on:
  push:
    paths:
      - ".github/workflows/import-asset-allocation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout standalone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone source asset-allocation branch
        run: |
          git clone --branch asset-allocation --single-branch https://github.com/Alireza77n/LOB-Market-Making.git /tmp/lob-source

      - name: Copy final and historical Mohammadreza contribution files
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/lob-source
          mkdir -p notebooks dashboard/.streamlit docs

          cp "$SRC/analysis/notebooks/asset_allocation/deeplob_dls_asset_allocation-version1.ipynb" notebooks/deeplob_dls_asset_allocation-version1.ipynb
          cp "$SRC/dashboard/asset_allocation/app.py" dashboard/app.py
          cp "$SRC/dashboard/asset_allocation/README.md" dashboard/README.md
          cp "$SRC/dashboard/asset_allocation/requirements.txt" dashboard/requirements.txt
          cp "$SRC/dashboard/asset_allocation/.streamlit/config.toml" dashboard/.streamlit/config.toml
          cp "$SRC/docs/asset_allocation/README.md" docs/README.md
          cp "$SRC/docs/asset_allocation/DeepLOB_DLS_Asset_Allocation_Documentation.pdf" docs/DeepLOB_DLS_Asset_Allocation_Documentation.pdf

          git -C "$SRC" show c190e82fc3fbc78f8d3ef39dc550bce53371bd8e:analysis/notebooks/asset_allocation/deeplob_dls_asset_allocation.ipynb > notebooks/deeplob_dls_asset_allocation.ipynb
          git -C "$SRC" show c190e82fc3fbc78f8d3ef39dc550bce53371bd8e:docs/asset_allocation/DeepLOB_DLS_Report_documentation.pdf > docs/DeepLOB_DLS_Report_documentation.pdf

          cat > CONTRIBUTIONS.md <<'EOF'
          # Contribution provenance

          This standalone repository collects the Asset Allocation files contributed by
          **Mohammadreza Sheikholeslami** (`MohammadrezaSheikholeslami84`) to the
          `asset-allocation` branch of `Alireza77n/LOB-Market-Making`.

          Identified commits by this GitHub account on that branch, newest to oldest:

          - `1dde8527b116426cd906a5250ce362f4bc438655` — Update README.md
          - `97ca659c3b44411265ade066be6514cff50c2ea6` — Update app.py
          - `fddd67ce99bd09ee7bbf44f6b1f103ff5485c444` — Update README.md
          - `fc0e2c3d78b75477b2377101b6991f19fc9c7099` — Rename dashboard-report.md to README.md
          - `c190e82fc3fbc78f8d3ef39dc550bce53371bd8e` — Update Project files and add Dashboard report
          - `c0716e9ecfbbaa832d422ceb06f4f33c4a6d2769` — Update readme
          - `310f3a804e237534e74c4f8d6e63d1f149aae173` — fix readme formulas
          - `ea578f3b6441617181231f6858f6b83b2ddf23b0` — fix readme math formula
          - `5abc186fa00f7b140df30fd092f7da3b61733601` — Add asset allocation README
          - `6a3d6f32e580e9c9bafb873573ebd4f12e16c0dc` — Add asset allocation notebook report and dashboard

          Files that were later renamed or removed from the source branch tip are preserved
          here from their latest relevant Mohammadreza-authored revision so the standalone
          repository does not lose earlier work.
          EOF

      - name: Commit imported contribution files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Mohammadreza Sheikholeslami"
          git config user.email "166950228+MohammadrezaSheikholeslami84@users.noreply.github.com"
          git add notebooks dashboard docs CONTRIBUTIONS.md
          if git diff --cached --quiet; then
            echo "No import changes to commit."
            exit 0
          fi
          git commit -m "Import Asset Allocation contributions"
          git push origin HEAD:main
